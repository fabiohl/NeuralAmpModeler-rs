[package]
name = "nam-preflight"
version = "1.0.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Safe-baseline OS/ISA/FP preflight probe for NeuralAmpModeler-rs (no AVX2 required to start)."
publish = false
autobins = false

[[bin]]
name = "nam_preflight"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
