[package]
name = "nam-qa"
version = "1.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Maintainer-only QA binaries for NeuralAmpModeler-rs. Not published."
publish = false
autobins = false

[[bin]]
name = "gen_stress"
path = "src/bin/gen_stress.rs"

[[bin]]
name = "wav_to_golden"
path = "src/bin/wav_to_golden.rs"

[[bin]]
name = "nam_golden_catalog"
path = "src/bin/nam_golden_catalog.rs"

[[bin]]
name = "nam_freshness"
path = "src/bin/nam_freshness.rs"

[[bin]]
name = "nam_long_receipt"
path = "src/bin/nam_long_receipt.rs"

[[bin]]
name = "nam_quality"
path = "src/bin/nam_quality.rs"

[[bin]]
name = "nam_remote_simd_receipt"
path = "src/bin/nam_remote_simd_receipt.rs"

[dependencies]
NeuralAmpModeler-rs = { path = "../..", features = ["testing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
