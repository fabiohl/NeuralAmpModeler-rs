name: Long QA Suite

# Hosted long QA with a single, recommended configuration. Intentionally
# zero-input: the GitHub "Run workflow" button must not ask questions. Strict
# engine QA and the documented phase list are the defaults.
on:
  workflow_dispatch:

permissions:
  contents: read

# A newer run cancels any previous manual run on the same ref.
concurrency:
  group: long-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NAM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  CARGO_TARGET_DIR: target/long/release

jobs:
  long-qa:
    name: long-qa (x86_64-linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        id: provenance
        run: |
          set -euo pipefail
          mkdir -p target/logs
          sha=$(git rev-parse HEAD)
          ref=$(git rev-parse --abbrev-ref HEAD)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          rustc_ver=$(rustc --version)
          cargo_ver=$(cargo --version)
          printf 'PHASE: provenance ref=%s sha=%s package_version=%s rustc="%s" cargo="%s"\n' \
            "$ref" "$sha" "$version" "$rustc_ver" "$cargo_ver" | tee target/logs/ci-provenance.log
          cat > target/logs/evidence-manifest.json <<EOF
          {
            "run_id": "${NAM_RUN_ID}",
            "ref": "${ref}",
            "sha": "${sha}",
            "package_version": "${version}",
            "rustc": "${rustc_ver}",
            "cargo": "${cargo_ver}",
            "runner_os": "${RUNNER_OS:-Linux}",
            "runner_arch": "${RUNNER_ARCH:-X64}"
          }
          EOF
          {
            echo "### Long QA provenance"
            echo "- ref: \`$ref\`"
            echo "- sha: \`$sha\`"
            echo "- package: \`$version\`"
            echo "- rustc: \`$rustc_ver\`"
            echo "- cargo: \`$cargo_ver\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release build gate
        run: |
          cargo build --locked --release --workspace --features testing
          cargo test --locked --release --features testing --no-run
      - name: Setup third-party (C++ oracle)
        run: lib_quiet=1 ./utils/setup-third-party.sh
      - name: Long QA Suite
        # Zero-input workflow: the GitHub "Run workflow" button always uses this
        # recommended configuration. Strict is the engine's release-gate default;
        # the phase list covers all non-isolated-core gates on shared CI runners.
        run: >-
          ./utils/tests-long.sh --strict --only
          'preflight-render,preflight-catalog,preflight-package,preflight-freshness,preflight-simd-probe,phase1,phase2,phase3,phase4,phase7'
      - name: AVX-512 Cross-ISA Parity Gate
        run: lib_quiet=1 ./utils/remote-simd-gate.sh --skip-bench
      - name: Quality Dashboard (fidelity + parity)
        run: lib_quiet=1 ./utils/quality-dashboard.sh --check docs/quality-contract.json --fidelity-only
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: Long QA Suite (${{ github.ref }} @ ${{ steps.provenance.outputs.sha }})
      - name: Upload logs and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: long-logs-receipts
          path: target/logs/**
          if-no-files-found: error
          retention-days: 14
