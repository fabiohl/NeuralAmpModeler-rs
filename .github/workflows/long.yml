name: Long QA Suite

on:
  workflow_dispatch:
    inputs:
      phases:
        description: 'Comma-separated phase IDs to execute'
        type: string
        default: 'preflight-render,preflight-catalog,preflight-package,preflight-freshness,phase1,phase2,phase3,phase4,phase7'
      strict:
        description: 'Strict mode (treat gaps as failures)'
        type: boolean
        default: true

permissions:
  contents: read

# A newer run cancels any previous manual run on the same ref.
concurrency:
  group: long-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NAM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  long-qa:
    name: long-qa (x86_64-linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Setup third-party (C++ oracle)
        run: ./utils/setup-third-party.sh
      - name: Long QA Suite
        run: |
          STRICT_FLAG=""
          if [ "${{ inputs.strict }}" = "true" ]; then
            STRICT_FLAG="--strict"
          fi
          ./utils/tests-long.sh $STRICT_FLAG --only "${{ inputs.phases }}"
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: Long QA Suite (${{ github.ref_name }} @ ${{ github.sha }})
      - name: Quality Dashboard (fidelity + parity)
        if: always()
        run: ./utils/quality-dashboard.sh --check docs/quality-contract.json --fidelity-only
      - name: Upload logs and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-logs-receipts
          path: |
            target/logs/**
            target/long/**/*.jsonl
          if-no-files-found: ignore
          retention-days: 14
