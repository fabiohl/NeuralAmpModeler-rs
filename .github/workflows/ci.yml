name: CI

on:
  push:
    branches: [main, dev, 'dev-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NAM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # x86_64 is the reference platform: canonical lints discipline.
  # Quick QA and parity vectors live in a separate job so a documentation-only
  # lint failure cannot suppress functional evidence (see AI-24).
  x86_64-linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustup target add aarch64-unknown-linux-gnu && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Lints (fmt, check, clippy, policies, budget)
        run: ./utils/lints.sh
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: x86_64-linux-lints
          note: 'x86_64 Linux canonical lints (fmt, check, clippy, policies, budget)'
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-x86_64-linux
          path: target/logs/**
          retention-days: 14

  # x86_64 functional evidence is independent of the lints job.
  x86_64-linux-quick:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Quick QA suite
        run: ./utils/tests-quick.sh
      - name: Build release parity tool
        run: cargo build --release --locked -p nam-qa --bin nam_parity_vector
      - name: Generate release parity vectors
        run: |
          mkdir -p target/parity-vectors/x86_64-linux
          ./target/release/nam_parity_vector generate \
            --model tests/fixtures/models/BossWN-standard.nam \
            --signal v1 \
            --out target/parity-vectors/x86_64-linux/BossWN-standard.bin \
            --sample-rate 48000 \
            --block-size 64
          ./target/release/nam_parity_vector generate \
            --model tests/fixtures/models/BossLSTM-1x16.nam \
            --signal v1 \
            --out target/parity-vectors/x86_64-linux/BossLSTM-1x16.bin \
            --sample-rate 48000 \
            --block-size 64
      - name: Upload parity vectors (x86_64-linux)
        uses: actions/upload-artifact@v4
        with:
          name: parity-vectors-x86_64-linux
          path: target/parity-vectors/x86_64-linux/*.bin
          retention-days: 14
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: x86_64-linux-quick
          note: 'x86_64 Linux quick QA and release parity vector export'
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-x86_64-linux-quick
          path: target/logs/**
          retention-days: 14

  # aarch64 targets (NEON backend): clippy + quick QA suite.
  aarch64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            timeout: 40
          - name: linux-arm64
            os: ubuntu-26.04-arm
            timeout: 30
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v7
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --features testing -- -D warnings
      # macOS ships bash 3.2; the QA scripts need bash >= 4.
      - name: Install bash (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! bash -c '(( BASH_VERSINFO[0] >= 4 ))' 2>/dev/null; then
            brew install bash
            echo "QA_BASH=$(brew --prefix)/bin/bash" >> "$GITHUB_ENV"
          fi
      - name: Quick QA suite
        run: ${QA_BASH:-bash} ./utils/tests-quick.sh
      - name: Build release parity tool
        run: cargo build --release --locked -p nam-qa --bin nam_parity_vector
      - name: Generate release parity vectors
        run: |
          mkdir -p target/parity-vectors/${{ matrix.name }}
          ./target/release/nam_parity_vector generate \
            --model tests/fixtures/models/BossWN-standard.nam \
            --signal v1 \
            --out target/parity-vectors/${{ matrix.name }}/BossWN-standard.bin \
            --sample-rate 48000 \
            --block-size 64
          ./target/release/nam_parity_vector generate \
            --model tests/fixtures/models/BossLSTM-1x16.nam \
            --signal v1 \
            --out target/parity-vectors/${{ matrix.name }}/BossLSTM-1x16.bin \
            --sample-rate 48000 \
            --block-size 64
      - name: Upload parity vectors (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: parity-vectors-${{ matrix.name }}
          path: target/parity-vectors/${{ matrix.name }}/*.bin
          retention-days: 14
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: ${{ matrix.name }}
          note: 'Native ARM64 quick QA and release parity vector export'
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: target/logs/**
          retention-days: 14

  # MSRV job: validates compilation with rust-version from Cargo.toml (1.99.0).
  msrv:
    name: msrv (1.99.0)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.99.0 --no-self-update --profile minimal && rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Cargo check (MSRV)
        shell: bash
        run: |
          set -o pipefail
          . utils/_lib.sh
          STATUS_NAME=msrv
          PHASE_NAME=msrv; phase msrv
          set +e
          cargo check --locked --all-targets --features testing 2>&1 | tee "$LOG_DIR/msrv.log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            FAILS+=("msrv")
            emit "PHASE: msrv FAIL rc=$rc log=$LOG_DIR/msrv.log"
            finish || true
            exit "$rc"
          fi
          emit "PHASE: msrv PASS log=$LOG_DIR/msrv.log"
          finish
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: msrv (1.99.0)
          note: 'MSRV compiler check and diagnostics publication under Rust 1.99.0'
      - name: Upload MSRV diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-msrv
          path: |
            target/logs/msrv.log
            target/logs/summary.txt
            target/logs/msrv-status.tsv
          retention-days: 14
          if-no-files-found: warn

  # Quick-discipline C++ parity job: runs only the non-ignored C++ oracle cases
  # (multichannel linear and WAV-IR), fail-closed when the oracle is required.
  # The extensive ignored C++ parity matrix runs only in tests-long.sh.
  cpp-parity:
    name: cpp-parity-quick (x86_64-linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Setup third-party (C++ oracle)
        run: ./utils/setup-third-party.sh
      - name: Build C++ NAMCore render binary
        run: ./utils/ensure_namcore_render.sh
      - name: Quick QA suite (require C++ oracle)
        env:
          NAM_REQUIRE_CPP_ORACLE: '1'
        run: ./utils/tests-quick.sh
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: cpp-parity-quick (x86_64-linux)
          note: 'Non-ignored C++ oracle cases in the quick discipline (15 multichannel/WAV-IR tests); ignored long matrix is not executed here'
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-cpp-parity
          path: target/logs/**
          retention-days: 14

  # External consumer contract smoke test (x86_64 and aarch64).
  consumer-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: consumer-smoke-x86_64
            os: ubuntu-26.04
          - name: consumer-smoke-arm64
            os: ubuntu-26.04-arm
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Update Rust toolchain and targets
        run: rustup update --no-self-update stable && rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Consumer smoke test
        run: ./utils/consumer-smoke.sh
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: ${{ matrix.name }}
          note: 'External consumer crate compilation contract verification'
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: target/logs/**
          retention-days: 14

  # Cross-platform parity verification: exchanges artifacts between x86_64 and aarch64 native runs.
  cross-platform-parity:
    name: cross-platform-parity
    needs: [x86_64-linux-quick, aarch64]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Build comparator binary
        run: cargo build --release --locked -p nam-qa --bin nam_parity_vector
      - name: Download x86_64-linux vectors
        uses: actions/download-artifact@v4
        with:
          name: parity-vectors-x86_64-linux
          path: target/parity-vectors/x86_64-linux
      - name: Download macos-arm64 vectors
        uses: actions/download-artifact@v4
        with:
          name: parity-vectors-macos-arm64
          path: target/parity-vectors/macos-arm64
      - name: Download linux-arm64 vectors
        uses: actions/download-artifact@v4
        with:
          name: parity-vectors-linux-arm64
          path: target/parity-vectors/linux-arm64
      - name: Cross-platform parity verification
        run: |
          mkdir -p target/logs/parity
          MODELS=("BossWN-standard.bin" "BossLSTM-1x16.bin")
          PLATFORMS=("x86_64-linux" "linux-arm64" "macos-arm64")
          for m in "${MODELS[@]}"; do
            for p in "${PLATFORMS[@]}"; do
              if [ ! -f "target/parity-vectors/$p/$m" ]; then
                echo "PHASE: cross-platform-parity GAP platform_vector_missing=$p/$m"
                exit 1
              fi
            done
          done

          # Pairwise comparison: x86_64 vs linux-arm64 (cross-ISA: calibrated numerical envelope)
          for m in "${MODELS[@]}"; do
            echo "--- Comparing x86_64-linux vs linux-arm64 ($m) ---"
            ./target/release/nam_parity_vector compare \
              "target/parity-vectors/x86_64-linux/$m" \
              "target/parity-vectors/linux-arm64/$m" \
              --max-esr 1e-6 --min-snr-db 100.0 \
              --report-out "target/logs/parity/report-x86-vs-linux-arm64-$m.json"
          done

          # Pairwise comparison: x86_64 vs macos-arm64 (cross-ISA: calibrated numerical envelope)
          for m in "${MODELS[@]}"; do
            echo "--- Comparing x86_64-linux vs macos-arm64 ($m) ---"
            ./target/release/nam_parity_vector compare \
              "target/parity-vectors/x86_64-linux/$m" \
              "target/parity-vectors/macos-arm64/$m" \
              --max-esr 1e-6 --min-snr-db 100.0 \
              --report-out "target/logs/parity/report-x86-vs-macos-arm64-$m.json"
          done

          # Pairwise comparison: linux-arm64 vs macos-arm64 (intra-ISA NEON: strict bitwise identity)
          for m in "${MODELS[@]}"; do
            echo "--- Comparing linux-arm64 vs macos-arm64 ($m) ---"
            ./target/release/nam_parity_vector compare \
              "target/parity-vectors/linux-arm64/$m" \
              "target/parity-vectors/macos-arm64/$m" \
              --report-out "target/logs/parity/report-linux-arm64-vs-macos-arm64-$m.json"
          done

          echo "AVX-512 status: GAP (opt-in research feature; physical AVX-512 hardware absent on standard CI runners)"
          mkdir -p target/logs
          echo "PHASE: cross-platform-parity PASS log=target/logs/parity" > target/logs/summary.txt
          echo "RESULT: PASS (0s) fails=none gaps=none" >> target/logs/summary.txt
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: cross-platform-parity
          note: 'Pairwise bitwise parity verification across x86_64-linux, linux-arm64, macos-arm64'
      - name: Upload parity comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-comparison-reports
          path: target/logs/parity/**
          retention-days: 14
