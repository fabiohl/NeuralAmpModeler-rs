name: CI

on:
  push:
    branches: [main, arm64-port]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Every job is gated on the same condition: only run in the rread fork, and
# only for events triggered by rread (pushes, PRs opened by rread, manual
# dispatch). Activity by anyone else, or this file landing in another repo,
# skips all jobs.

jobs:
  # x86_64 is the reference platform: full lints + the quick QA suite.
  x86_64-linux:
    if: github.repository == 'rread/NeuralAmpModeler-rs' && github.actor == 'rread'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (all features)
        run: cargo clippy --all-targets --features testing,heap-audit,fft-radix4-planner,avx512,rt-hardening
      - name: Clippy (default features)
        run: cargo clippy --all-targets --features testing
      - name: Quick QA suite
        # Gaps (e.g. no C++ NAMCore render binary on the runner) warn instead of failing.
        run: ./utils/tests-quick.sh --allow-gaps

  # aarch64 targets (NEON backend): lints + the quick QA suite.
  aarch64:
    if: github.repository == 'rread/NeuralAmpModeler-rs' && github.actor == 'rread'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: linux-arm64
            os: ubuntu-26.04-arm
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --features testing
      # macOS ships bash 3.2; the QA scripts need bash >= 4. NAM_NO_LOW_PRIORITY
      # skips the `nice` re-exec, which would go back through /bin/bash.
      - name: Install bash (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "QA_BASH=$(brew --prefix)/bin/bash" >> "$GITHUB_ENV"
          echo "NAM_NO_LOW_PRIORITY=1" >> "$GITHUB_ENV"
      - name: Quick QA suite
        # Gaps (e.g. no C++ NAMCore render binary on the runner) warn instead of failing.
        run: ${QA_BASH:-bash} ./utils/tests-quick.sh --allow-gaps
