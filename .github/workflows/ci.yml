name: CI

on:
  push:
    branches: [main, dev, 'dev-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NAM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # x86_64 is the reference platform: canonical lints discipline.
  # Quick QA and parity vectors live in a separate job so a documentation-only
  # lint failure cannot suppress functional evidence (see AI-24).
  x86_64-linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustup target add aarch64-unknown-linux-gnu && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        run: |
          mkdir -p target/logs
          printf 'PHASE: provenance ref=%s sha=%s package_version=%s rustc="%s" cargo="%s"\n' \
            "${{ github.ref_name }}" "$(git rev-parse HEAD)" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" \
            "$(rustc --version)" "$(cargo --version)" | tee target/logs/ci-provenance.log
      - name: Lints (fmt, check, clippy, policies, budget)
        run: ./utils/lints.sh
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: x86_64-linux-lints
          note: 'x86_64 Linux canonical lints (fmt, check, clippy, policies, budget)'
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-x86_64-linux
          path: target/logs/**
          retention-days: 14

  # x86_64 functional evidence is independent of the lints job.
  x86_64-linux-quick:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        run: |
          mkdir -p target/logs
          printf 'PHASE: provenance ref=%s sha=%s package_version=%s rustc="%s" cargo="%s"\n' \
            "${{ github.ref_name }}" "$(git rev-parse HEAD)" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" \
            "$(rustc --version)" "$(cargo --version)" | tee target/logs/ci-provenance.log
      - name: Quick QA suite
        run: ./utils/tests-quick.sh
      - name: Build release parity tool
        run: cargo build --release --locked -p nam-qa --bin nam_parity_vector
      - name: Generate release parity vectors (AVX2)
        run: |
          mkdir -p target/parity-vectors/x86_64-linux
          for stem in BossWN-standard BossLSTM-1x16 BossLSTM-2x8 wavenet_a2_lite wavenet_a2_full convnet_nobn linear_nobias; do
            ./target/release/nam_parity_vector generate \
              --model "tests/fixtures/models/${stem}.nam" \
              --signal v1 \
              --out "target/parity-vectors/x86_64-linux/${stem}.bin" \
              --sample-rate 48000 \
              --block-size 64
          done
      - name: Upload parity vectors (x86_64-linux)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-vectors-x86_64-linux
          path: target/parity-vectors/x86_64-linux/*.bin
          retention-days: 14
      - name: Generate release parity vectors (AVX-512)
        run: |
          mkdir -p target/parity-vectors/x86_64-avx512
          rc=0
          cargo run --release --locked --bin simd_probe -- --check-avx512 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "AVX512_GENERATED=1" > target/parity-vectors/x86_64-avx512/status.env
            cargo build --release --locked -p nam-qa --bin nam_parity_vector --features NeuralAmpModeler-rs/avx512
            for stem in BossWN-standard BossLSTM-1x16 BossLSTM-2x8 wavenet_a2_lite wavenet_a2_full convnet_nobn linear_nobias; do
              ./target/release/nam_parity_vector generate \
                --model "tests/fixtures/models/${stem}.nam" \
                --signal v1 \
                --out "target/parity-vectors/x86_64-avx512/${stem}.bin" \
                --sample-rate 48000 \
                --block-size 64
            done
          elif [ "$rc" -eq 3 ]; then
            echo "AVX512_GENERATED=0" > target/parity-vectors/x86_64-avx512/status.env
          else
            exit "$rc"
          fi
      - name: Upload parity vectors (x86_64-avx512)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-vectors-x86_64-avx512
          path: target/parity-vectors/x86_64-avx512/*
          retention-days: 14
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: x86_64-linux-quick
          note: 'x86_64 Linux quick QA and release parity vector export'
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-x86_64-linux-quick
          path: target/logs/**
          retention-days: 14

  # aarch64 targets (NEON backend): clippy + quick QA suite.
  aarch64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            timeout: 40
          - name: linux-arm64
            os: ubuntu-26.04-arm
            timeout: 30
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runner images can ship an older preinstalled stable; the crate needs rust-version 1.99.
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        run: |
          mkdir -p target/logs
          printf 'PHASE: provenance ref=%s sha=%s package_version=%s rustc="%s" cargo="%s"\n' \
            "${{ github.ref_name }}" "$(git rev-parse HEAD)" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" \
            "$(rustc --version)" "$(cargo --version)" | tee target/logs/ci-provenance.log
      # macOS ships bash 3.2; the QA scripts need bash >= 4.
      - name: Install bash (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! bash -c '(( BASH_VERSINFO[0] >= 4 ))' 2>/dev/null; then
            brew install bash
            echo "QA_BASH=$(brew --prefix)/bin/bash" >> "$GITHUB_ENV"
          fi
      # Linux ARM64 runs the full canonical discipline (fmt, check/clippy matrix,
      # cross-x86_64, doc, policies, budget); macOS keeps the native clippy gate
      # because the full lint matrix exceeds its job budget.
      - name: Install cross target (Linux ARM64)
        if: runner.os == 'Linux'
        run: rustup target add x86_64-unknown-linux-gnu
      - name: Lints (Linux ARM64)
        if: runner.os == 'Linux'
        run: ${QA_BASH:-bash} ./utils/lints.sh
      - name: Clippy (macOS ARM64)
        if: runner.os == 'macOS'
        run: cargo clippy --locked --workspace --all-targets --features testing -- -D warnings
      - name: Quick QA suite
        run: ${QA_BASH:-bash} ./utils/tests-quick.sh
      - name: Build release parity tool
        run: cargo build --release --locked -p nam-qa --bin nam_parity_vector
      - name: Generate release parity vectors
        run: |
          mkdir -p target/parity-vectors/${{ matrix.name }}
          for stem in BossWN-standard BossLSTM-1x16 BossLSTM-2x8 wavenet_a2_lite wavenet_a2_full convnet_nobn linear_nobias; do
            ./target/release/nam_parity_vector generate \
              --model "tests/fixtures/models/${stem}.nam" \
              --signal v1 \
              --out "target/parity-vectors/${{ matrix.name }}/${stem}.bin" \
              --sample-rate 48000 \
              --block-size 64
          done
      - name: Upload parity vectors (${{ matrix.name }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-vectors-${{ matrix.name }}
          path: target/parity-vectors/${{ matrix.name }}/*.bin
          retention-days: 14
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: ${{ matrix.name }}
          note: 'Native ARM64 quick QA and release parity vector export'
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.name }}
          path: target/logs/**
          retention-days: 14

  # MSRV job: validates compilation with rust-version from Cargo.toml (1.99.0).
  # rust-toolchain.toml pins `stable`, so RUSTUP_TOOLCHAIN is required to override it;
  # `rustup default` alone would be silently ignored by the toolchain file.
  msrv:
    name: msrv (1.99.0)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.99.0 --no-self-update --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        run: |
          mkdir -p target/logs
          printf 'PHASE: provenance ref=%s sha=%s package_version=%s toolchain=msrv-1.99.0 rustc="%s" cargo="%s"\n' \
            "${{ github.ref_name }}" "$(git rev-parse HEAD)" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" \
            "$(rustc --version)" "$(cargo --version)" | tee target/logs/ci-provenance.log
      - name: Cargo check (MSRV)
        shell: bash
        run: |
          set -euo pipefail
          . utils/_lib.sh
          STATUS_NAME=msrv
          lib_init
          trap 'trap_fail $?' ERR
          PHASE_NAME=msrv; phase msrv
          set +e
          cargo check --locked --workspace --all-targets --features testing 2>&1 | tee "$LOG_DIR/msrv.log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            FAILS+=("msrv")
            emit "PHASE: msrv FAIL rc=$rc log=$LOG_DIR/msrv.log"
            finish || true
            exit "$rc"
          fi
          emit "PHASE: msrv PASS log=$LOG_DIR/msrv.log"
          finish
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: msrv (1.99.0)
          note: 'MSRV compiler check and diagnostics publication under Rust 1.99.0'
      - name: Upload MSRV diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-msrv
          path: |
            target/logs/msrv.log
            target/logs/summary.txt
            target/logs/msrv-status.tsv
            target/logs/ci-provenance.log
          retention-days: 14
          if-no-files-found: warn

  # Quick-discipline C++ parity job: runs only the non-ignored C++ oracle cases
  # (multichannel linear and WAV-IR), fail-closed when the oracle is required.
  # The extensive ignored C++ parity matrix runs only in tests-long.sh.
  cpp-parity:
    name: cpp-parity-quick (x86_64-linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        run: |
          mkdir -p target/logs
          printf 'PHASE: provenance ref=%s sha=%s package_version=%s rustc="%s" cargo="%s"\n' \
            "${{ github.ref_name }}" "$(git rev-parse HEAD)" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" \
            "$(rustc --version)" "$(cargo --version)" | tee target/logs/ci-provenance.log
      - name: Setup third-party (C++ oracle)
        run: lib_quiet=1 ./utils/setup-third-party.sh
      - name: Build C++ NAMCore render binary
        run: lib_quiet=1 ./utils/ensure_namcore_render.sh
      - name: Quick QA suite (require C++ oracle)
        env:
          NAM_REQUIRE_CPP_ORACLE: '1'
        run: ./utils/tests-quick.sh
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: cpp-parity-quick (x86_64-linux)
          note: 'Non-ignored C++ oracle cases in the quick discipline (15 multichannel/WAV-IR tests); ignored long matrix is not executed here'
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-cpp-parity
          path: target/logs/**
          retention-days: 14

  # External consumer contract smoke test (x86_64 and aarch64).
  consumer-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: consumer-smoke-x86_64
            os: ubuntu-26.04
          - name: consumer-smoke-arm64
            os: ubuntu-26.04-arm
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update Rust toolchain and targets
        run: rustup update --no-self-update stable && rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        run: |
          mkdir -p target/logs
          printf 'PHASE: provenance ref=%s sha=%s package_version=%s rustc="%s" cargo="%s"\n' \
            "${{ github.ref_name }}" "$(git rev-parse HEAD)" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" \
            "$(rustc --version)" "$(cargo --version)" | tee target/logs/ci-provenance.log
      - name: Consumer smoke test
        run: ./utils/consumer-smoke.sh
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: ${{ matrix.name }}
          note: 'External consumer crate compilation contract verification'
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.name }}
          path: target/logs/**
          retention-days: 14

  # Cross-platform parity verification: exchanges artifacts between x86_64 and aarch64 native runs.
  cross-platform-parity:
    name: cross-platform-parity
    needs: [x86_64-linux-quick, aarch64]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update Rust toolchain
        run: rustup update --no-self-update stable && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') }}
      - name: Record provenance
        run: |
          mkdir -p target/logs
          printf 'PHASE: provenance ref=%s sha=%s package_version=%s rustc="%s" cargo="%s"\n' \
            "${{ github.ref_name }}" "$(git rev-parse HEAD)" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" \
            "$(rustc --version)" "$(cargo --version)" | tee target/logs/ci-provenance.log
      - name: Build comparator binary
        run: cargo build --release --locked -p nam-qa --bin nam_parity_vector
      - name: Download x86_64-linux vectors
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-vectors-x86_64-linux
          path: target/parity-vectors/x86_64-linux
      - name: Download x86_64-avx512 vectors
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-vectors-x86_64-avx512
          path: target/parity-vectors/x86_64-avx512
      - name: Download macos-arm64 vectors
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-vectors-macos-arm64
          path: target/parity-vectors/macos-arm64
      - name: Download linux-arm64 vectors
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-vectors-linux-arm64
          path: target/parity-vectors/linux-arm64
      - name: Cross-platform parity verification
        run: |
          set -euo pipefail
          . utils/_lib.sh
          STATUS_NAME=cross-platform-parity
          lib_init
          PHASE_NAME=cross-platform-parity; phase "$PHASE_NAME"
          mkdir -p target/logs/parity

          MODELS=(
            "BossWN-standard.bin" "BossLSTM-1x16.bin" "BossLSTM-2x8.bin"
            "wavenet_a2_lite.bin" "wavenet_a2_full.bin" "convnet_nobn.bin" "linear_nobias.bin"
          )
          PLATFORMS=("x86_64-linux" "linux-arm64" "macos-arm64")
          AVX512_GENERATED=0
          if [ -f "target/parity-vectors/x86_64-avx512/status.env" ]; then
            . "target/parity-vectors/x86_64-avx512/status.env"
          fi
          [ "${AVX512_GENERATED:-0}" = "1" ] && PLATFORMS+=("x86_64-avx512")

          for m in "${MODELS[@]}"; do
            for p in "${PLATFORMS[@]}"; do
              if [ ! -f "target/parity-vectors/$p/$m" ]; then
                FAILS+=("vector-missing-$p-$m")
                emit "PHASE: cross-platform-parity FAIL reason=vector_missing platform=$p model=$m"
                finish || true
                exit 1
              fi
            done
          done

          compare_pair() {
            local left="$1" right="$2"; shift 2
            local m rc
            for m in "${MODELS[@]}"; do
              echo "--- Comparing $left vs $right ($m) ---"
              rc=0
              ./target/release/nam_parity_vector compare \
                "target/parity-vectors/$left/$m" \
                "target/parity-vectors/$right/$m" \
                "$@" \
                --report-out "target/logs/parity/report-${left}-vs-${right}-$m.json" 2>&1 | tee "target/logs/parity/compare-${left}-vs-${right}-$m.log" || rc=$?
              [ "$rc" -ne 0 ] && FAILS+=("compare-${left}-vs-${right}-$m")
            done
          }

          # Pairwise cross-ISA comparisons (calibrated numerical envelope)
          compare_pair x86_64-linux linux-arm64 --max-esr 1e-6 --min-snr-db 100.0
          compare_pair x86_64-linux macos-arm64 --max-esr 1e-6 --min-snr-db 100.0
          # Pairwise intra-ISA NEON comparison (strict bitwise identity)
          compare_pair linux-arm64 macos-arm64

          if [ "${AVX512_GENERATED:-0}" = "1" ]; then
            compare_pair x86_64-linux x86_64-avx512 --max-esr 1e-6 --min-snr-db 100.0
            compare_pair x86_64-avx512 linux-arm64 --max-esr 1e-6 --min-snr-db 100.0
            compare_pair x86_64-avx512 macos-arm64 --max-esr 1e-6 --min-snr-db 100.0
          else
            gap "avx512-parity-vector-not-generated"
          fi

          if [ ${#FAILS[@]} -gt 0 ]; then
            emit "PHASE: cross-platform-parity FAIL rc=1 log=target/logs/parity"
            finish || true
            exit 1
          else
            emit "PHASE: cross-platform-parity PASS log=target/logs/parity"
            finish || exit 1
          fi
      - name: Publish step summary
        if: always()
        uses: ./.github/actions/qa-summary
        with:
          title: cross-platform-parity
          note: 'Pairwise parity verification across x86_64-linux (AVX2/AVX-512), linux-arm64, macos-arm64'
      - name: Upload parity comparison reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-comparison-reports
          path: target/logs/parity/**
          retention-days: 14
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-cross-platform-parity
          path: target/logs/**
          retention-days: 14
